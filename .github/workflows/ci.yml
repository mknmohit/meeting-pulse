name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - run: brew install swift-format
      - run: swift-format lint --strict --recursive mac-app/Packages mac-app/Tools
      - name: Test Swift packages
        run: |
          for package in MPCore MPSupport MPDetection MPSync; do
            (cd "mac-app/Packages/$package" && swift test --enable-code-coverage) || exit 1
          done
      - name: Keep MPCore pure
        run: |
          ! grep -rE '^import (AppKit|ApplicationServices|Supabase)' \
            mac-app/Packages/MPCore/Sources
      - name: Build the app shell with placeholder config
        run: |
          cp mac-app/Config.xcconfig.example mac-app/Config.xcconfig
          xcodebuild -project mac-app/MeetingPulse.xcodeproj \
            -scheme MeetingPulse \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: viewer
      - run: pnpm run check && pnpm run lint && pnpm test && pnpm run format:check
        working-directory: viewer
      - name: Placeholder config must fail the build
        working-directory: viewer
        run: |
          cp .env.example .env
          if pnpm run build >build.log 2>&1; then
            echo "::error::.env.example must not build"
            exit 1
          fi
          grep -q PUBLIC_SUPABASE_URL build.log
          rm -f build.log .env
      - name: CI config must build
        working-directory: viewer
        run: |
          cp .env.ci .env
          pnpm run headers
          pnpm run build
          grep -q '950bbeef' dist/index.html
          rm -f .env public/_headers

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated normalization fixture
        run: |
          node mac-app/Tools/gen-normalization-fixture.mjs
          git diff --exit-code -- supabase/tests/generated_normalization_values.sql \
            supabase/tests/generated_normalization_values.sql.in
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db --db-url 'postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres'
