<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
    <style>
      :root { color-scheme: light dark; }
      body {
        display: block;
        min-height: 0;
        margin: 0;
        background: transparent;
        color: CanvasText;
        font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { display: grid; gap: 8px; justify-items: start; padding: 0; text-align: left; }
      p { margin: 0; font-size: 13px; }
      #turnstile { min-height: 65px; }
    </style>
  </head>
  <body>
    <main>
      <p id="message">Loading security check...</p>
      <div id="turnstile"></div>
    </main>
    <script>
      window.meetingPulseTurnstile = {
        render(siteKey) {
          if (!window.turnstile || typeof window.turnstile.render !== "function") {
            window.setTimeout(() => this.render(siteKey), 250);
            return;
          }
          document.querySelector("#message").textContent = "Complete the security check.";
          window.turnstile.render("#turnstile", {
            sitekey: siteKey,
            callback(token) {
              document.querySelector("#message").textContent = "Security check complete.";
              window.webkit.messageHandlers.meetingPulse.postMessage({ token: token });
            },
            "expired-callback"() {
              window.webkit.messageHandlers.meetingPulse.postMessage({ error: "TURNSTILE_EXPIRED" });
            },
            "error-callback"() {
              window.webkit.messageHandlers.meetingPulse.postMessage({ error: "TURNSTILE_FAILED" });
            }
          });
        }
      };
    </script>
  </body>
</html>
